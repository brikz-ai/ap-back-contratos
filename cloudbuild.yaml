# Deploy do contratos-service em Cloud Run (spec 2026-09-04 §2.3/§3).
# Pipeline simples: build → push → deploy — sem jobs de migration, o schema
# é aplicado manualmente via scripts/apply_schema.py (decisão YAGNI do
# design original, 2026-08-24-contratos-service-design.md §1).
#
# Uso manual (fora do trigger):
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_TAG=$(git rev-parse --short HEAD)
#
# Também roda automático: trigger "contratos-deploy-master" a cada push na
# master de github.com/brikzai/ap-back-contratos (docs/runbooks/gcp-setup.md
# seção 5b).
#
# Pré-requisitos: docs/runbooks/gcp-setup.md seções 1-4 e os segredos do(s)
# tenant(s) (seção 6).
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}:${_TAG}', '.']

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}:${_TAG}']

  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      # Público: o webhook da CERC chama de fora do GCP; a autenticação é
      # Basic Auth por tenant na aplicação (apps/contratos/views.py::_autenticado).
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --concurrency=20
      - --min-instances=0
      - --max-instances=3
      - --timeout=60
      - --service-account=${_RUNTIME_SA}
      # ^|^ troca o separador para '|' — '@' (usado no optin) quebra aqui
      # porque PUBSUB_PUSH_INVOKER_SA é um e-mail de service account, que
      # também contém '@'. CORS_ALLOWED_ORIGINS pode ter vírgulas, daí não
      # dá pra usar o separador default.
      # KEYCLOAK_AP_*: aceita também os tokens do Keycloak (realm ap, client
      # ap-console) durante a transição IAM → Keycloak — ver shared/jwt_auth.py.
      - --set-env-vars=^|^ENVIRONMENT=${_ENVIRONMENT}|GOOGLE_CLOUD_PROJECT=$PROJECT_ID|ALLOWED_HOSTS=*|CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS}|IAM_JWT_ISSUER=brikz-iam|KEYCLOAK_AP_ISSUER=https://auth.brikz.ai/realms/ap|KEYCLOAK_AP_AUDIENCE=ap-console|CERC_AUTH_URL=${_CERC_AUTH_URL}|CERC_API_BASE_URL=${_CERC_API_BASE_URL}|PUBSUB_PUSH_AUDIENCE=${_PUBSUB_PUSH_AUDIENCE}|PUBSUB_PUSH_INVOKER_SA=${_PUBSUB_PUSH_INVOKER_SA}|WEB_CONCURRENCY=2
      # O nome do segredo no Secret Manager tem sufixo _CONTRATOS (o optin já
      # usa "DJANGO_SECRET_KEY" sem sufixo) — evita os dois serviços
      # compartilharem sem querer a mesma chave de assinatura Django. O env
      # var dentro do container continua DJANGO_SECRET_KEY (nome que
      # config/settings.py já lê), só a origem no Secret Manager muda.
      # IAM_JWT_PUBLIC_KEY_BRIKZ_IAM é a chave do IAM real. IAM_JWT_PUBLIC_KEY é a
      # chave LOCAL de homolog (gerar_jwt.py): o jwt_auth só a aceita com
      # IAM_JWT_ACEITAR_CHAVE_HOMOLOG=true (ausente aqui = recusada, fail-closed;
      # este deploy atende o front real mesmo com ENVIRONMENT=homolog). Para rotação
      # da chave do IAM, montar também IAM_JWT_PUBLIC_KEYS (PEMs concatenadas).
      - --set-secrets=DJANGO_SECRET_KEY=DJANGO_SECRET_KEY_CONTRATOS:latest,IAM_JWT_PUBLIC_KEY=IAM_JWT_PUBLIC_KEY:latest,IAM_JWT_PUBLIC_KEY_BRIKZ_IAM=IAM_JWT_PUBLIC_KEY_BRIKZ_IAM:latest

substitutions:
  _TAG: manual                     # passe _TAG=$(git rev-parse --short HEAD) no submit
  _REGION: southamerica-east1
  _SERVICE: contratos-service
  _IMAGE: southamerica-east1-docker.pkg.dev/brikz-ap/contratos/contratos-service
  _RUNTIME_SA: contratos-run@brikz-ap.iam.gserviceaccount.com
  _ENVIRONMENT: homolog
  # Duas portas do Vite: 5173 é a padrão, 5174 é o fallback automático quando
  # a 5173 já está ocupada (outro serviço do ap-front rodando na mesma
  # máquina). Sem a 5174 aqui, o preflight dessa origem volta 200 mas SEM
  # Access-Control-Allow-Origin e o browser bloqueia o fetch. O separador
  # ^|^ do --set-env-vars acima existe exatamente para esta vírgula.
  _CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,https://ap.brikz.ai,https://ap-front-1009092036032.southamerica-east1.run.app,https://ap-front-6sy5bhymwq-rj.a.run.app,https://ap-front-1009092036032.us-east1.run.app
  _CERC_AUTH_URL: https://api.int.cerc.com/oauth/token
  _CERC_API_BASE_URL: https://ap-homolog.cerc.inf.br
  # String fixa acordada entre este env var e a audiência configurada na
  # push subscription (Task 9) e no Cloud Scheduler (Task 10) — não precisa
  # ser a URL real do Cloud Run, só precisa ser idêntica nos três lugares.
  _PUBSUB_PUSH_AUDIENCE: https://contratos-service.internal/webhooks/contrato/processar
  _PUBSUB_PUSH_INVOKER_SA: contratos-pubsub-push@brikz-ap.iam.gserviceaccount.com

serviceAccount: projects/brikz-ap/serviceAccounts/contratos-build@brikz-ap.iam.gserviceaccount.com
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
